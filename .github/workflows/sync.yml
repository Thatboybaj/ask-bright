# Keeps Ask Bright in sync with brightajiboye.com.
# Runs every day, and any time you click "Run workflow" on GitHub.
name: Sync portfolio

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC (06:17 Qatar time)
  workflow_dispatch:        # adds a manual "Run workflow" button

permissions:
  contents: write           # lets the workflow commit the updated index

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: pip install -r scripts/requirements-sync.txt

      - name: Pull case studies from the live site
        run: python scripts/sync_site.py

      - name: Rebuild the search index
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
        run: python scripts/build_index.py

      - name: Commit if anything changed
        run: |
          git config user.name "ask-bright-bot"
          git config user.email "actions@users.noreply.github.com"
          git add knowledge/site index.json
          if git diff --cached --quiet; then
            echo "No changes on the site."
          else
            git commit -m "Sync knowledge from brightajiboye.com"
            git push
          fi
